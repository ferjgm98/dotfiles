set -g default-terminal "xterm-256color"
set -as terminal-features ",xterm-256color:RGB"
set-option -sg escape-time 10
# Smart pane switching with awareness of Vim splits (corrected is_vim logic).
set -g @vim_regex 'g?(view|l?n?vim?x?|fzf)(diff)?'

bind-key -n 'C-h' if-shell "tmux show -g @vim_regex" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "tmux show -g @vim_regex" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "tmux show -g @vim_regex" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "tmux show -g @vim_regex" 'send-keys C-l' 'select-pane -R'

unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-a
set -g base-index 1

set -g mouse on
set-option -g focus-events on
set-option -g display-time 3000
set -g allow-passthrough on
set -g renumber-windows on
set -g history-limit 50000   # increase scrollback buffer
set -g status-interval 5     # refresh status bar every 5s (for git info)


bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key m resize-pane -Z
bind-key x kill-pane

bind - split-window -v # Split panes vertically
bind | split-window -h # Split panes horizontally

# swap window to left or right
bind-key -r < swap-window -t -1
bind-key -r > swap-window -t +1

bind-key -T root S-Enter send-keys Escape "[13;2u"

set -g detach-on-destroy off  # don't exit from tmux when closing a session
set-option -g status-position top
set -g extended-keys on
set -g extended-keys-format csi-u

bind-key "o" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# # List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'egel/tmux-gruvbox'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'sainnhe/tmux-fzf'

# Pane navigation in copy-mode-vi (C-hjkl handled by vim-tmux-navigator plugin)
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Theme - Gruvbox Dark
set -g @tmux-gruvbox 'dark'  # options: 'dark', 'dark256', 'light', 'light256'

bind -N "last-session (via sesh) " L run-shell "sesh last"

run '~/.tmux/plugins/tpm/tpm'

# Override status-right after TPM to show path + git info (no empty sections)
set -g status-right-length 120
set -g status-right "#[bg=#3c3836,fg=#504945,nobold,nounderscore,noitalics]#[bg=#504945,fg=#a89984] #{b:pane_current_path} #[fg=#ebdbb2]#(~/.tmux/scripts/git-status.sh #{q:pane_current_path}) #[bg=#504945,fg=#504945]"
